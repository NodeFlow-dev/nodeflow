<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">NodeFlow — HAProxy Infrastructure Control</title>
  <desc id="desc">Тёмный фирменный баннер NodeFlow с графом Panel, Node Agent и HAProxy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640"><stop stop-color="#0F0E0F"/><stop offset=".57" stop-color="#151214"/><stop offset="1" stop-color="#1B1517"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C27087"/><stop offset="1" stop-color="#9B5267"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#ffffff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1280" height="640" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="20" fill="url(#grid)"/>
  <circle cx="1065" cy="161" r="182" fill="#C27087" fill-opacity=".16" filter="url(#glow)"/>
  <circle cx="120" cy="595" r="170" fill="#9B5267" fill-opacity=".11" filter="url(#glow)"/>
  <g transform="translate(86 78)">
    <svg x="0" y="4" width="74" height="55" viewBox="0 0 42 28" aria-hidden="true"><path d="M2 25V3h5.4l9.1 12.4V3H22v22h-5.3L7.5 12.5V25H2Z" fill="url(#pink)"/><path d="M24 3h16v5H30v4h8.5v5H30v8h-6V3Z" fill="url(#pink)"/></svg>
    <text x="91" y="26" fill="#F2EFF0" font-family="Arial, sans-serif" font-size="28" font-weight="700">NodeFlow</text>
    <text x="91" y="50" fill="#A9A1A4" font-family="Arial, sans-serif" font-size="14" letter-spacing="2.3">HAProxy INFRASTRUCTURE CONTROL</text>
  </g>
  <g font-family="Arial, sans-serif"><text x="86" y="245" fill="#F2EFF0" font-size="62" font-weight="700">Control the flow.</text><text x="86" y="309" fill="#F2EFF0" font-size="62" font-weight="700">Keep the control.</text>
  <text x="90" y="359" fill="#AAA3A6" font-size="21">Ноды, TCP/SNI-маршруты, трафик и безопасные ревизии HAProxy —</text><text x="90" y="391" fill="#AAA3A6" font-size="21">в одной прозрачной control plane.</text></g>
  <g transform="translate(88 471)" font-family="Arial, sans-serif"><rect width="114" height="42" rx="21" fill="#C27087"/><text x="57" y="27" text-anchor="middle" fill="#171214" font-size="15" font-weight="700">v1.0.7</text><rect x="126" width="128" height="42" rx="21" fill="#1A1718" stroke="#393135"/><text x="190" y="27" text-anchor="middle" fill="#E4DEDF" font-size="15" font-weight="600">HAProxy</text><rect x="266" width="204" height="42" rx="21" fill="#1A1718" stroke="#393135"/><text x="368" y="27" text-anchor="middle" fill="#E4DEDF" font-size="15" font-weight="600">Docker Compose</text></g>
  <g transform="translate(770 142)" font-family="Arial, sans-serif"><path d="M135 98C197 98 219 116 273 116" stroke="#E78DAC" stroke-width="2" stroke-dasharray="5 7"/><path d="M273 116l-11-7v14l11-7Z" fill="#E78DAC"/><path d="M295 168C246 168 208 196 167 231" stroke="#89D8BE" stroke-width="2" stroke-dasharray="5 7"/><path d="M167 231l5-12 10 10-15 2Z" fill="#89D8BE"/><path d="M296 168C351 168 380 212 391 263" stroke="#E78DAC" stroke-width="2" stroke-dasharray="5 7"/><path d="M391 263l-7-11 14-1-7 12Z" fill="#E78DAC"/>
    <g><rect x="0" y="55" width="135" height="86" rx="15" fill="#1D1D25" stroke="#F09AB8" stroke-opacity=".55"/><circle cx="26" cy="84" r="7" fill="#F09AB8"/><text x="45" y="89" fill="#F8EEF2" font-size="16" font-weight="700">Panel</text><text x="20" y="118" fill="#AFA1A9" font-size="13">desired state</text></g>
    <g><rect x="273" y="116" width="196" height="92" rx="15" fill="#1D1D25" stroke="#EAE2E6" stroke-opacity=".30"/><circle cx="301" cy="147" r="7" fill="#89D8BE"/><text x="320" y="152" fill="#F8EEF2" font-size="16" font-weight="700">Node Agent</text><text x="294" y="181" fill="#AFA1A9" font-size="13">mTLS heartbeat</text></g>
    <g><rect x="88" y="231" width="166" height="86" rx="15" fill="#1D1D25" stroke="#89D8BE" stroke-opacity=".55"/><circle cx="115" cy="260" r="7" fill="#89D8BE"/><text x="134" y="265" fill="#F8EEF2" font-size="16" font-weight="700">HAProxy</text><text x="108" y="294" fill="#AFA1A9" font-size="13">validated reload</text></g>
    <g><rect x="356" y="267" width="132" height="86" rx="15" fill="#1D1D25" stroke="#F09AB8" stroke-opacity=".55"/><circle cx="383" cy="296" r="7" fill="#F09AB8"/><text x="402" y="301" fill="#F8EEF2" font-size="16" font-weight="700">Flow</text><text x="376" y="330" fill="#AFA1A9" font-size="13">TCP / SNI</text></g>
  </g>
  <text x="88" y="584" fill="#8E7C86" font-family="Arial, sans-serif" font-size="14">OBSERVE  /  CONTROL  /  DEPLOY</text>
</svg>
