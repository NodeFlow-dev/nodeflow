name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go vet and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nodeflow
          POSTGRES_USER: nodeflow
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nodeflow -d nodeflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal migrations)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: Unit tests
        run: go test -count=1 ./...
      - name: Apply migrations (embedded runner)
        env:
          DATABASE_URL: postgres://nodeflow:ci-only-password@127.0.0.1:5432/nodeflow?sslmode=disable
        run: go run ./cmd/panel-api migrate
      - name: PostgreSQL integration tests
        # Known stale fixtures (see docs/releases/2.0.0.md, «Известные
        # ограничения»): reported, not blocking, until the fixtures are fixed.
        continue-on-error: true
        env:
          TZ: UTC
          NODEFLOW_TEST_DATABASE_URL: postgres://nodeflow:ci-only-password@127.0.0.1:5432/nodeflow?sslmode=disable
        run: go test -count=1 -p 1 ./internal/...

  frontend:
    name: Frontend typecheck, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  scripts:
    name: Shell scripts and compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh scripts/install-node.sh scripts/export-public.sh scripts/build-install-kit.sh
      - name: Install bundle checks
        run: ./scripts/test-install-bundle.sh
